# dsh-video-gen — 文生视频
#
# 注册宿主插件行（设置页、video_generate 工具、视频流路由都在这一行里）。
# 默认端点按需求设为 http://ai9700:8080/upstream/MiniMax-H3-Video/v1；
# 插件会自动补 /videos，实际请求 .../v1/videos。
# apiKey 是 secret 字段，保存后设置页只显示“已保存”，不回传明文。
- insert:
    - id: video-gen
      name: dsh-video-gen
      config:
        enabled: true
        endpoint: http://ai9700:8080/upstream/MiniMax-H3-Video/v1
        model: minimax-h3
        size: 1344x768
        seconds: 5
        audio: keep
        sampler: res_multistep
        numInferenceSteps: 25
        latentUpscale: 4
        positivePrompt: >-
          shot on 35mm film, Kodak Portra 400, soft overcast daylight, matte skin with visible pores and fine facial hair, natural lip texture, small skin imperfections, muted earthy colour grade, low contrast, soft highlight roll-off, subtle film grain, documentary realism, no retouching
        negativePrompt: >-
          oil painting, ultra detailed, 8k, hyperrealistic, cinematic glow, rim light, glossy, flawless/beauty retouched skin, HDR, dramatic lighting
        positivePromptDisabled: false
        negativePromptDisabled: true
        outputDir: .dsh-video-gen
        timeoutSec: 900
        pollIntervalSec: 2
        deleteRemote: true
